<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <title>100マス計算</title>
</head>
<body>
  <div class="app-header">
    <h1>100マス計算 <small id="version"></small></h1>
  </div>

  <header>
    <div id="controls">
      <label>
        演算:
        <select id="opSelect">
          <option value="+">足し算 (+)</option>
          <option value="-">引き算 (−)</option>
          <option value="*">掛け算 (×)</option>
        </select>
      </label>

      <label class="slider-label">
        上限:
        <input type="range" id="maxValue" min="2" max="99" step="1" value="9" />
        <span id="maxValueDisplay" class="slider-value">9</span>
      </label>

      <button id="regenerateBtn">↺ 作り直す</button>
      <button id="startBtn">▶ 開始</button>

      <div class="timer-wrapper">
        <span class="timer-label">TIME</span>
        <div id="timer">00:00:000</div>
      </div>
    </div>
  </header>

  <main>
    <p class="hint">
      <kbd>S</kbd> キーまたは開始ボタンでスタート &nbsp;·&nbsp; <kbd>ESC</kbd> で入力削除
    </p>
    <div id="grid" aria-live="polite"></div>
  </main>

  <footer>
    <div id="bestTime">Best: -</div>
    <div id="timeHistory">
      <div class="history-label">History</div>
    </div>
    <button id="clearHistoryBtn">履歴をクリア</button>
  </footer>

  <script type="module" src="dist/app.js" defer></script>
</body>
</html>
